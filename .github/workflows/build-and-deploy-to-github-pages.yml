name: Axidraw Web Deployment
run-name: ${{ github.actor }} is deploying Axidraw Web to GitHub Pages
on:
  workflow_dispatch:
      
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0 # first release with pnpm 12 support
        with:
          run_install: true
      - name: Build
        run: pnpm build
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
